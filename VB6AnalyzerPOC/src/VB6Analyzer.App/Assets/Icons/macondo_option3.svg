<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#12161C"/>
  <defs>
    <linearGradient id="opt3_needle" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>
  <!-- Broken Dial Arcs -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#FF7043" stroke-width="5" stroke-dasharray="28 16" stroke-linecap="round"/>
  <!-- Needle Head (NE) -->
  <polygon points="100,28 52,52 64,64" fill="url(#opt3_needle)"/>
  <polygon points="100,28 76,76 64,64" fill="#E64A19"/>
  <!-- Needle Tail (SW) -->
  <polygon points="28,100 52,52 64,64" fill="#CBD5E1"/>
  <polygon points="28,100 76,76 64,64" fill="#94A3B8"/>
  <!-- Center Pivot -->
  <circle cx="64" cy="64" r="6" fill="#12161C" stroke="#F8FAFC" stroke-width="2"/>
</svg>