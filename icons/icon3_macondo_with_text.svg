<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="g-ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="50%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>

    <linearGradient id="g-needle-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="40%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#ff3d71"/>
    </linearGradient>

    <linearGradient id="g-needle-bottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5722"/>
      <stop offset="60%" stop-color="#e64a19"/>
      <stop offset="100%" stop-color="#d81b60"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff5722" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g id="compass" filter="url(#glow)">
    <circle cx="512" cy="455" r="205"
            fill="none"
            stroke="url(#g-ring)"
            stroke-width="24"
            stroke-linecap="round"
            stroke-dasharray="128.8 32.2"
            stroke-dashoffset="16.1" />

    <g transform="translate(512, 455) rotate(-45)">
      <polygon points="0,-305 -68,0 0,0" fill="url(#g-needle-top)" />
      <polygon points="0,0 -68,0 0,305" fill="url(#g-needle-top)" />

      <polygon points="0,-305 68,0 0,0" fill="url(#g-needle-bottom)" />
      <polygon points="0,0 68,0 0,305" fill="url(#g-needle-bottom)" />

      <line x1="0" y1="-305" x2="0" y2="305" stroke="#ffffff" stroke-width="2.5" opacity="0.4" />
      <polygon points="0,-160 38,0 0,160 -38,0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35" />
    </g>
  </g>
  
    <text x="512" y="800"
          font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', sans-serif"
          font-size="88"
          font-weight="700"
          letter-spacing="-0.5"
          fill="#ffffff"
          text-anchor="middle">Macondo</text>
</svg>