<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <linearGradient id="g-green-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10e783"/>
      <stop offset="100%" stop-color="#05c872"/>
    </linearGradient>

    <linearGradient id="g-blue-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d62ff"/>
      <stop offset="100%" stop-color="#3347e6"/>
    </linearGradient>

    <linearGradient id="g-dark-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252a35"/>
      <stop offset="100%" stop-color="#181b22"/>
    </linearGradient>

    <filter id="star-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#star-shadow)">
    <!-- LEFT HALF (GREEN THEME) -->
    <polygon points="512,512 450.0,362.3 512.0,147.0" fill="url(#g-green-bright)" />
    <polygon points="512,512 450.0,362.3 315.4,315.4" fill="url(#g-dark-slate)" stroke="#05c872" stroke-width="4" stroke-linejoin="round" />
    <polygon points="512,512 362.3,450.0 315.4,315.4" fill="url(#g-green-bright)" />
    <polygon points="512,512 362.3,450.0 147.0,512.0" fill="url(#g-green-bright)" />
    <polygon points="512,512 362.3,574.0 147.0,512.0" fill="url(#g-dark-slate)" stroke="#05c872" stroke-width="4" stroke-linejoin="round" />
    <polygon points="512,512 362.3,574.0 315.4,708.6" fill="url(#g-green-bright)" />
    <polygon points="512,512 450.0,661.7 315.4,708.6" fill="url(#g-dark-slate)" stroke="#05c872" stroke-width="4" stroke-linejoin="round" />
    <polygon points="512,512 450.0,661.7 512.0,877.0" fill="url(#g-green-bright)" />

    <!-- RIGHT HALF (ROYAL BLUE THEME) -->
    <polygon points="512,512 574.0,362.3 512.0,147.0" fill="url(#g-blue-bright)" />
    <polygon points="512,512 574.0,362.3 708.6,315.4" fill="url(#g-dark-slate)" stroke="#4d62ff" stroke-width="4" stroke-linejoin="round" />
    <polygon points="512,512 661.7,450.0 708.6,315.4" fill="url(#g-blue-bright)" />
    <polygon points="512,512 661.7,450.0 877.0,512.0" fill="url(#g-dark-slate)" stroke="#4d62ff" stroke-width="4" stroke-linejoin="round" />
    <polygon points="512,512 661.7,574.0 877.0,512.0" fill="url(#g-blue-bright)" />
    <polygon points="512,512 661.7,574.0 708.6,708.6" fill="url(#g-blue-bright)" />
    <polygon points="512,512 574.0,661.7 708.6,708.6" fill="url(#g-dark-slate)" stroke="#4d62ff" stroke-width="4" stroke-linejoin="round" />
    <polygon points="512,512 574.0,661.7 512.0,877.0" fill="url(#g-dark-slate)" stroke="#4d62ff" stroke-width="4" stroke-linejoin="round" />

    <line x1="512" y1="147" x2="512" y2="877" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="147" y1="512" x2="877" y2="512" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>